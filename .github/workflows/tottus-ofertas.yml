name: Tottus Ofertas Bot

on:
  schedule:
    # Corre cada 15 minutos. GitHub puede retrasar un poco la ejecución
    # en horas de mucha carga, pero en la práctica corre casi siempre a tiempo.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # te permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  buscar-ofertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tottus_bot.py
